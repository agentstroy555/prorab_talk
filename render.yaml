services:
  - type: web
    name: prorab-talk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: prorab-talk-db
          property: connectionString

databases:
  - name: prorab-talk-db
    plan: free
    databaseName: prorab_talk
    user: prorab_talk
    ipAllowList: []
